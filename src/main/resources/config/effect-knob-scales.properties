# =============================================================================
# Effect knob display-scale facts
# =============================================================================
# Source: Fender Fuse's own UI (direct observation on the person's PC), recorded
# in docs/features.md. This is NOT the amp/protocol itself, and NOT independently
# hardware-write-tested the way e.g. Bias/main-EQ scaling was (see
# mustang-app-requirements.md Section 20). Treat every entry here as "Fuse says
# this is the real-world range" - a display-layer fact, not a wire-protocol fact.
# The raw byte read from/written to the amp is completely unaffected either way;
# this only controls what the app is allowed to *show* alongside the raw slider,
# via KnobSpec's existing displayMin/displayMax/displayUnit mechanism.
#
# Format: <EFFECT_ENUM_NAME>.knob<index 0-5>.<field> = <value>
#   displayMin, displayMax  - real-world range, linear (double)
#   unit                    - display suffix appended by KnobSpec.formatDisplayValue,
#                             e.g. " Hz", " ms", ":1" (no leading space if the unit
#                             normally sits flush against the number)
#   source                  - FUSE_UI       = read directly off a features.md entry
#                             EXTRAPOLATED  = same DSP engine/knob position as a
#                                             FUSE_UI entry, but not itself measured
#   note                    - free text, optional
#
# A knob with no entry here just stays a plain 0-max raw slider, same as before
# this file existed. Nothing currently loads this file automatically - see the
# companion doc (docs/effect-knob-scale-facts.md) for wiring notes and the
# cross-check against EffectModel.java that produced it.
# =============================================================================

# --- Compressor: Ratio (knob index 2) ---
COMPRESSOR.knob2.displayMin=2
COMPRESSOR.knob2.displayMax=100
COMPRESSOR.knob2.unit=:1
COMPRESSOR.knob2.source=FUSE_UI

