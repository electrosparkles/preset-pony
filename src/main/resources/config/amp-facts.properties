# =============================================================================
# Amp factory-default & feature facts
# =============================================================================
#
# Format: <AmpModel enum name>.<field> = <value>
#
# All default.* values are RAW BYTES (0-255) ready to assign directly to
# AmpSettings fields. Original Fuse dial-scale observations are recorded, 
# but Fuse does not give a value when modifying amp dial values.
# Observations preserved as inline comments. Conversions done once here at authoring time.
#
# Conversion formulas used:
#   1-10 scale (main EQ, most amps):  raw = round((display - 1.0) / 9.0 * 255)
#   0-10 scale (gain2, some amps):    raw = round(display / 10.0 * 255)
#   1-7  scale (British Colour only): raw = round((display - 1.0) / 6.0 * 255)
#   percent (depth, masterVolume):    raw = round(percent / 100.0 * 255)
#   bias:      raw 128 = MID = 0%;  stored as raw directly
#   sag:       Less=0, Match=1, More=2; stored as index
#   noiseGate: OFF=0, LOW=1, MID=2, HIGH=3, MAX=4; stored as index
#   brightness/features: see per-field notes below
#
# Features field:
#   Comma-separated list of extra controls beyond the standard set.
#   Standard set (every amp): gain, volume, treble, middle, bass,
#   noiseGate, threshold, depth, sag, bias, usbGain.
#   Optional extras: PRESENCE, BLEND, GAIN2, MASTER_VOLUME, REVERB,
#   SPEED, INTENSITY, BRIGHTNESS, CUT.
#   Note: REVERB/SPEED/INTENSITY live in effect slots, not AmpSettings -
#   they are recorded here for completeness but not loaded into AmpSettings.
#
# cabinetCode: CabinetModel enum constant name, directly CabinetModel.valueOf()-able.
#
# Tilde (~) prefix on original research values = even more approximate reading.
# =============================================================================


