# --- British '60s (VOX AC30) ---
# NOTE: this amp has TWO different "depth" concepts:
#   default.depth (below) = the standard noise-gate Depth field in AmpSettings.
#   The amp's own Depth knob (paired with Speed, a tremolo-style pre-amp effect)
#   lives in effect slots, not AmpSettings - not stored here.
# BRIGHTNESS defaults ON for this model.
# CUT is this amp's relabeled Presence control (same wire byte).
BRITISH_60S.features=BRIGHTNESS,SPEED,DEPTH,CUT
BRITISH_60S.cabinetCode=VOX_2X12_CELESTION
BRITISH_60S.default.gain=166      # dial 6.5 on 0-10
BRITISH_60S.default.volume=178    # dial 7   on 0-10
BRITISH_60S.default.treble=153    # dial 6   on 0-10
BRITISH_60S.default.middle=128    # dial 5   on 0-10
BRITISH_60S.default.bass=178      # dial 7   on 0-10
BRITISH_60S.default.brightness=1  # ON
BRITISH_60S.default.noiseGate=0   # OFF
BRITISH_60S.default.threshold=0
BRITISH_60S.default.depth=128     # 50% (noise-gate Depth)
BRITISH_60S.default.sag=1         # Match
BRITISH_60S.default.bias=128      # MID / 0%


